<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WCPL — Team</title>

  <link rel="stylesheet" href="../css/main.css?v=2" />
  <link rel="stylesheet" href="../css/tables.css?v=2" />
</head>

<body class="team-page">
  <header class="site-header">
    <a class="brand" href="../index.html">
  <img
    src="../assets/wcpl_logo.png"
    alt="WCPL"
    class="league-logo"
  />
</a>


    <nav class="nav">
	  <a href="teams.html">Teams</a>
      <a href="players.html">Players</a>
      <a href="games.html">Games</a>
	  <a href="charts.html">Charts</a>
	  <a href="fantasy.html">Fantasy</a>
    </nav>

    <div class="header-right">
      <label class="season-picker">
        <span>Season</span>
        <select id="seasonSelect"></select>
      </label>
    </div>
  </header>

  <main class="page">
    <div id="status" class="status">Loading…</div>

    <!-- Team header card -->
<section id="teamHero" class="team-hero" hidden>
  <div class="team-hero-left">
    <img id="teamLogo" class="team-hero-logo" alt="Team logo" />
    <div>
      <h1 id="teamName" class="team-hero-name"></h1>
      <div id="teamMeta" class="team-hero-meta"></div>
      <div id="teamEmpty" class="status" hidden></div>
    </div>
  </div>

  <div class="team-hero-right">
    <a id="viewScheduleBtn" class="team-schedule-btn">
      View Schedule
    </a>
  </div>
</section>

    <!-- Two-column layout -->
    <section id="teamBody" class="two-col">
      <!-- Roster -->
      <div class="card team-box">
		<div class="card-title team-box-title stats-header">
  <span>Roster</span>

  <label class="control compact">
  <select id="rateMode" class="select">
    <option value="TOTAL" selected>Totals</option>
    <option value="P15">Per 15</option>
  </select>

  <select id="stageSelect">
    <option value="REG">Regular Season</option>
    <option value="PO">Playoffs</option>
  </select>
</label>
</div>


        <div class="table-wrap">
          <table class="data-table" id="skatersTable">
<thead>
  <tr>
    <th>Skater</th>
    <th class="num" data-key="gp">GP</th>
    <th class="num" data-key="g">G</th>
    <th class="num" data-key="a">A</th>
    <th class="num" data-key="pts">PTS</th>
    <th class="num" data-key="shots">S</th>
    <th class="num" data-key="shp">SH%</th>

    <!-- Advanced (hide when adv_stats=0) -->
    <th class="num adv" data-key="blk">BLK</th>
    <th class="num adv" data-key="passes">PASS</th>
    <th class="num adv" data-key="ta">TA</th>
    <th class="num adv" data-key="to">TO</th>
  </tr>
</thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="table-spacer"></div>

        <div class="table-wrap">
          <table class="data-table" id="goaliesTable">
<thead>
  <tr>
    <th>Goalie</th>
    <th class="num" data-key="gp">GP</th>
    <th class="num" data-key="sa">SA</th>
    <th class="num" data-key="ga">GA</th>
    <th class="num" data-key="sv">SV</th>
    <th class="num" data-key="svp">SV%</th>
    <th class="num" data-key="gaa">GAA</th>
    <th class="num" data-key="w">W</th>
    <th class="num" data-key="so">SO</th>
  </tr>
</thead>

            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- Analytics (replaces Match history) -->
      <div class="card team-box">
        <div class="card-title team-box-title">
          Analytics
        </div>

        <div id="teamAnalyticsStatus" class="status" hidden></div>

<div class="analytics-frame">
  <div class="analytics-cap analytics-cap-top">OFFENSE</div>
  <div id="teamAnalytics" class="analytics-plot"></div>
  <div class="analytics-cap analytics-cap-bottom">DEFENSE</div>
</div>

      </div>

    </section>
  </main>

  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script type="module" src="../js/team.js?v=4"></script>
</body>
</html>
